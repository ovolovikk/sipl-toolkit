<text x="380" y="21" text-anchor="middle" class="title">sipl · SIPL на Rust</text>
<clipPath id="c0"><rect x="22" y="42" width="0" height="22"><animate attributeName="width" from="0" to="328" begin="0.60s" dur="1.30s" fill="freeze"/></rect></clipPath><text x="22" y="58" clip-path="url(#c0)"><tspan class="prompt">$ </tspan><tspan class="cmd">sipl run examples/power.sipl X=2 Y=10</tspan></text>
<text x="22" y="80" class="state" opacity="0">[R ↦ 1024, X ↦ 2, Y ↦ 0]<animate attributeName="opacity" from="0" to="1" begin="2.25s" dur="0.25s" fill="freeze"/></text>
