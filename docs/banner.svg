<text x="22" y="212" class="trace" opacity="0">5:5      R := R * X            R: 1 → 2<animate attributeName="opacity" from="0" to="1" begin="5.52s" dur="0.25s" fill="freeze"/></text>
<text x="22" y="234" class="trace" opacity="0">6:5      Y := Y - 1            Y: 1 → 0<animate attributeName="opacity" from="0" to="1" begin="5.80s" dur="0.25s" fill="freeze"/></text>
<text x="22" y="256" class="trace" opacity="0">3:9      Y &gt; 0 = false<animate attributeName="opacity" from="0" to="1" begin="6.08s" dur="0.25s" fill="freeze"/></text>
<text x="22" y="278" class="state" opacity="0">       [R ↦ 2, X ↦ 2, Y ↦ 0]<animate attributeName="opacity" from="0" to="1" begin="6.36s" dur="0.25s" fill="freeze"/></text>
