<text x="22" y="146" class="trace" opacity="0">2:3    R := 1                R: — → 1<animate attributeName="opacity" from="0" to="1" begin="4.68s" dur="0.25s" fill="freeze"/></text>
<text x="22" y="168" class="trace" opacity="0">3:3    while Y &gt; 0 do<animate attributeName="opacity" from="0" to="1" begin="4.96s" dur="0.25s" fill="freeze"/></text>
