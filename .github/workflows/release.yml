name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked

      - name: Rename binary
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "target/release/sipl$ext" "sipl-$GITHUB_REF_NAME-${{ matrix.target }}$ext"

      - uses: actions/upload-artifact@v7
        with:
          name: sipl-${{ matrix.target }}
          path: sipl-${{ github.ref_name }}-*

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-sipl
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - run: npx vsce package

      - uses: actions/upload-artifact@v7
        with:
          name: vscode-sipl
          path: vscode-sipl/*.vsix

  release:
    needs: [binary, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } } found' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
